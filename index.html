<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMEWARE | Digital Transformation, Perfected.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #7C3AED;
            --secondary-color: #3B82F6;
            --text-color: #ffffff;
            --muted-text: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Effects */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, rgba(5, 5, 5, 0) 70%);
            border-radius: 50%;
            top: 20%;
            left: 10%;
            filter: blur(80px);
            animation: float 15s infinite alternate;
        }

        .glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(5, 5, 5, 0) 70%);
            border-radius: 50%;
            bottom: 10%;
            right: 5%;
            filter: blur(100px);
            animation: float 20s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 800px;
        }

        .logo-text {
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInDown 1s forwards;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 1s 0.3s forwards;
        }

        p {
            font-size: 1.25rem;
            color: var(--muted-text);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeInUp 1s 0.6s forwards;
        }

        .cta {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 400;
            letter-spacing: 0.1rem;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s 0.9s forwards;
        }

        .cta:hover {
            border-color: var(--accent-color);
            background: rgba(124, 58, 237, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }

        .footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            opacity: 0;
            animation: fadeIn 1s 1.2s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div class="logo-text">PRIMEWARE</div>
        <h1>Digital Transformation, <br>Perfected.</h1>
        <p>We are architecting the future of digital product engineering. A high-end experience is coming your way soon.</p>
        <a href="mailto:primeware@housefix.lk" class="cta">STAY IN TOUCH</a>
    </div>

    <div class="footer">
        &copy; 2026 PRIMEWARE. A subsidiary of HOUSEFIX.LK (PVT) LTD.
    </div>
</body>
</html>
